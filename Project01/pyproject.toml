 [project]
 name = "color2gray"
 version = "0.1.0"
 description = "Convert RGB images to grayscale using PyTorch 1x1 convolutions"
 readme = "README.md"
 requires-python = ">=3.10"
 dependencies = [
   "torch>=2.2",
   "Pillow>=10.0",
 ]

 [build-system]
 requires = ["setuptools", "wheel"]
 build-backend = "setuptools.build_meta"

 [tool.black]
 line-length = 100

 [tool.ruff]
 line-length = 100

 [tool.pytest.ini_options]
 pythonpath = ["src"]

